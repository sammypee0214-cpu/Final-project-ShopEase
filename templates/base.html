
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ShopEase{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">ShopEase</a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/cart/">Cart</a>
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        </nav>
    </header>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 ShopEase. All rights reserved.</p>
    </footer>

</body>
</html>
