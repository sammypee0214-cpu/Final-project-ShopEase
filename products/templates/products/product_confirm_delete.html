
{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Delete Product</h2>

    <p>Are you sure you want to delete "{{ product.name }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
</div>
{% endblock %}
